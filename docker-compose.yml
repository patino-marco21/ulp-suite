name: ulp-suite

networks:
  default:
    name: ulpsuite_network
    driver: bridge

services:
  # ─── ClickHouse (primary credential data store) ───────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: ulpsuite_clickhouse
    restart: unless-stopped
    # Ports intentionally NOT exposed on host — app connects via internal Docker network.
    # To query ClickHouse directly for debugging: docker exec -it ulpsuite_clickhouse clickhouse-client
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ulp}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      # IMPORTANT: Leave CLICKHOUSE_PASSWORD empty (the default).
      # docker/clickhouse/users/default-user.xml hardcodes an empty password for
      # the 'default' user.  If you set a non-empty password here the app will
      # fail every ClickHouse query (server has empty password, app sends yours).
      # The ClickHouse port is NOT exposed to the host, so no password is needed.
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # Memory: 32 GB total — 20 GB ClickHouse + 8 GB App + 4 GB OS/kernel headroom.
    # max_server_memory_usage (ulp-performance.xml) is 18 GB, 2 GB under this
    # container limit intentionally — see the memory ceiling comment there for
    # the live verification behind that number.
    mem_limit: 20g
    mem_reservation: 12g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d/
      - ./docker/clickhouse/config:/etc/clickhouse-server/config.d/
      - ./docker/clickhouse/users:/etc/clickhouse-server/users.d/
    healthcheck:
      # /ping is answered by a dedicated lightweight HTTP thread that bypasses the
      # query layer entirely — returns "Ok." in milliseconds regardless of whether
      # MATERIALIZE INDEX mutations are saturating background threads.
      # wget is pre-installed in the clickhouse/clickhouse-server image.
      # No auth needed: /ping is unauthenticated by design.
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 10s
      # /ping responds in <1 s when the server is alive; 5 s is generous.
      timeout: 5s
      # 90 retries × 10 s = 900 s (15 min) of checking after start_period expires.
      retries: 90
      # 60 s before the first check: ClickHouse's HTTP server (and therefore /ping)
      # starts responding within 10–30 s even on large datasets. 300 s was tuned for
      # SELECT 1 which needs the query layer fully ready; /ping needs only the HTTP
      # server thread, which starts far earlier.
      start_period: 60s
      # Docker Compose 2.20+: probe every 5 s DURING the start_period window
      # instead of waiting the full 60 s before the first probe.  Without this,
      # Docker runs zero probes for 60 s then starts the 10 s interval — meaning
      # a ClickHouse that's ready in 15 s still blocks the app container for ~70 s.
      # With start_interval: 5 s the app starts within ~20 s on a warm cache.
      start_interval: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── App (Next.js — SQLite for metadata, ClickHouse for credentials) ──────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ulpsuite_app
    # unless-stopped: restarts after laptop reboot (unlike on-failure which only
    # restarts on crash, not after a clean Docker daemon restart).
    restart: unless-stopped
    ports:
      # Loopback only by default. This app is a credential database and ships with 2FA off; a
      # published 0.0.0.0:3000 put its login page on every network the laptop joins (all 56 audit-log
      # entries to date came from the Docker gateway address, i.e. from the laptop itself). To reach it from another machine set
      # APP_BIND_ADDR=0.0.0.0 in .env -- and enrol 2FA for every account first.
      - "${APP_BIND_ADDR:-127.0.0.1}:3000:3000"
    # Memory: 8 GB container / 6 GB Node.js heap = 2 GB OS headroom.
    # Node.js 24 is container-aware — NODE_OPTIONS makes the limit explicit.
    mem_limit: 8g
    mem_reservation: 4g
    ulimits:
      # Docker's default nofile limit is 1024, which is too low for a service
      # that maintains persistent ClickHouse HTTP keep-alive sockets, a SQLite
      # file handle, and concurrently accepts HTTP connections.
      # 65536 matches typical production Node.js deployments; well below the
      # ClickHouse container's 262144 ceiling.
      nofile:
        soft: 65536
        hard: 65536
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=6144"
      # CRITICAL: Docker sets HOSTNAME to the container short-ID by default, silently
      # overriding the "ENV HOSTNAME=0.0.0.0" baked into the Dockerfile image.
      # Next.js standalone server.js reads process.env.HOSTNAME for its bind address;
      # without this override Next.js binds to the container's internal IP only, which
      # breaks all server-side fetch() calls to http://localhost:3000/api/... and makes
      # every SSR page fail to load. (Next.js issue #58657)
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # ClickHouse — credential data store
      CLICKHOUSE_HOST: "http://clickhouse:8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-ulp}
      # SQLite — app metadata (users, API keys, monitors, audit logs)
      SQLITE_PATH: /app/data/ulp.db
      # Auth — MUST be set to a random secret before first run
      JWT_SECRET: ${JWT_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Default admin (seeded on first startup if no users exist)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ulpsuite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Reverse proxies in front of the app that APPEND the client address to X-Forwarded-For
      # (lib/client-ip.ts). 0 = none, the default: the app is published on 127.0.0.1 only.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # Webhooks may only reach public addresses (lib/safe-http.ts). 1 also allows a receiver on your own network.
      WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-}
      # Import filtering — optional, configured in .env. These must be forwarded
      # explicitly because Compose does not inject arbitrary .env keys.
      INGEST_FILTER_HARD_DROP_TIERS: ${INGEST_FILTER_HARD_DROP_TIERS:-T3}
      INGEST_FILTER_DROP_NOISE: ${INGEST_FILTER_DROP_NOISE:-}
      INGEST_FILTER_DROP_TIERS: ${INGEST_FILTER_DROP_TIERS:-}
      INGEST_FILTER_KEEP_SUFFIXES: ${INGEST_FILTER_KEEP_SUFFIXES:-}
      INGEST_FILTER_DROP_SUFFIXES: ${INGEST_FILTER_DROP_SUFFIXES:-}
      # Ingest concurrency — optional, configured in .env. Must be forwarded
      # explicitly (see comment above). Default 1 (sequential) is safe on any
      # hardware; raise only where memory headroom is confirmed — see
      # docs/superpowers/specs/2026-07-20-ingest-memory-backpressure-design.md
      # and docs/superpowers/specs/2026-07-22-upload-concurrency-design.md.
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-1}
      # Import watchdog (lib/import-runner.ts) -- optional; forwarded explicitly (see above). An import with no progress for this
      # long (no batch inserted, no retry, no memory-guard poll) is failed and its queue slot freed. Empty = 20 minutes.
      IMPORT_STALL_TIMEOUT_MS: ${IMPORT_STALL_TIMEOUT_MS:-}
      # Exact-content dedup worker — report-only unless explicitly enabled.
      CONTENT_DEDUP_APPLY: ${CONTENT_DEDUP_APPLY:-false}
      DEDUP_CRON_HOURS: ${DEDUP_CRON_HOURS:-24}
      DEDUP_CRON_HOUR_UTC: ${DEDUP_CRON_HOUR_UTC:-4}
      DEDUP_MIN_EXCESS: ${DEDUP_MIN_EXCESS:-1000}
      CONTENT_DEDUP_BUCKET_COUNT: ${CONTENT_DEDUP_BUCKET_COUNT:-32}
      # Disk-space watcher (lib/disk-watch.ts) -- optional; forwarded explicitly (see above).
      # Empty values fall back to the defaults in code (check every 10 min; warn below the larger of
      # 100 GiB and 20% free; the critical floor is DISK_GUARD_MIN_FREE_BYTES / _RATIO).
      DISK_WATCH_MINUTES: ${DISK_WATCH_MINUTES:-}
      DISK_WARN_FREE_BYTES: ${DISK_WARN_FREE_BYTES:-}
      DISK_WARN_FREE_RATIO: ${DISK_WARN_FREE_RATIO:-}
      DISK_ALERT_WEBHOOK_URL: ${DISK_ALERT_WEBHOOK_URL:-}
      DISK_ALERT_REMINDER_HOURS: ${DISK_ALERT_REMINDER_HOURS:-}
      DISK_GUARD_MIN_FREE_BYTES: ${DISK_GUARD_MIN_FREE_BYTES:-}
      DISK_GUARD_MIN_FREE_RATIO: ${DISK_GUARD_MIN_FREE_RATIO:-}
      # SQLite snapshots (lib/sqlite-backup.ts) into ./data/backups -- optional, same rule.
      SQLITE_BACKUP_HOURS: ${SQLITE_BACKUP_HOURS:-}
      SQLITE_BACKUP_KEEP: ${SQLITE_BACKUP_KEEP:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./inbox:/app/inbox
    depends_on:
      clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── clickhouse-backup (P0: disaster recovery — local snapshots + S3) ──────
  # Profile-gated: does NOT start with `docker compose up`. Invoke explicitly via
  # the wrapper (./scripts/clickhouse-backup.sh ...) or directly:
  #   docker compose run --rm --no-deps clickhouse-backup <subcommand>
  # Shares the clickhouse data volume (needed for FREEZE/hardlink snapshots) and
  # reaches the server over the internal network at clickhouse:9000.
  # See docs/clickhouse-backup-runbook.md.
  clickhouse-backup:
    image: altinity/clickhouse-backup:2.7.2   # pinned — verified 2026-06-15 against ClickHouse 26.3
    container_name: ulpsuite_clickhouse_backup
    profiles: ["backup"]
    restart: "no"
    environment:
      # S3 (off-host) target — values come from .env (see .env.example).
      # These names are clickhouse-backup's env-var overrides for the s3.* config.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH: ${S3_PATH:-clickhouse-backups/ulpsuite}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-backup/config.yml:/etc/clickhouse-backup/config.yml:ro

volumes:
  clickhouse_data:
    driver: local
